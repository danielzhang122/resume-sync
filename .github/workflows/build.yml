# Builds resume.tex into Daniel_Zhang_Resume.pdf and resume-preview.webp,
# fails if the PDF is longer than one page, and commits both files back to the branch that was pushed.
name: Build résumé

on:
  push:
    paths:
      - resume.tex
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # resume.tex itself omits the build date and random ID from the PDF, so rebuilding
      # unchanged source gives a byte-identical PDF and the commit step below finds nothing to commit.
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Install PDF and WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp

      - name: Check it is one page
        run: |
          pages=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages: $pages"
          if [ "$pages" != "1" ]; then
            echo "::error::Résumé is $pages pages; it must be 1. Tighten the text."
            exit 1
          fi

      - name: Make PDF and preview image
        run: |
          mv resume.pdf Daniel_Zhang_Resume.pdf
          # 200 dpi on A4 gives 1654 x 2339 px, the size the website expects
          pdftoppm -r 200 -png -singlefile Daniel_Zhang_Resume.pdf preview
          cwebp -quiet -q 80 preview.png -o resume-preview.webp

      - name: Commit PDF and preview back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Daniel_Zhang_Resume.pdf resume-preview.webp
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build résumé PDF and preview"
            git push
          fi
